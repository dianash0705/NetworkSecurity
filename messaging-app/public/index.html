<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaTime 🍵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginSection">
        <div class="login-logo">🍵</div>
        <h1 class="login-title">TeaTime</h1>
        <p class="login-subtitle">Cozy conversations await ✨</p>
        <div class="login-input-group">
            <input type="text" id="usernameInput" placeholder="What's your name? 🌸">
            <button id="loginBtn">Join the party! 🎉</button>
        </div>
        <span id="status"></span>
    </div>

    <div id="app">
        <div id="container">
            <div id="contacts">
                <div class="sidebar-header">
                    <span class="sidebar-logo">🍵</span>
                    <div>
                        <div class="sidebar-title">TeaTime</div>
                        <div class="sidebar-user" id="currentUserDisplay"></div>
                    </div>
                </div>
                <div id="contactList"></div>
            </div>

            <div id="chatArea">
                <div id="chatWith">
                    <div class="empty-state">
                        <div class="empty-state-icon">💭</div>
                        <h3>No chat selected</h3>
                        <p>Pick a friend to start chatting!</p>
                    </div>
                </div>
                <div id="messages" style="display: none;"></div>
                <div id="inputArea" style="display: none;">
                    <input type="text" id="messageInput" placeholder="Type something sweet... 🌷" disabled>
                    <button id="sendBtn" disabled><span class="btn-icon">✨</span> Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
