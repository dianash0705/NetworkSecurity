<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Messenger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        #loginSection input { padding: 8px; margin-right: 10px; }
        #loginSection button { padding: 8px 16px; }
        #status { margin-left: 10px; color: green; font-weight: bold; }
        
        #app { display: none; margin-top: 20px; }
        #container { display: flex; gap: 20px; }
        
        #contacts { width: 200px; border: 1px solid #ccc; padding: 10px; }
        #contacts h3 { margin: 0 0 10px 0; font-size: 14px; }
        .contact { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .contact:hover { background: #f5f5f5; }
        .contact.active { background: #e3f2fd; }
        .contact .online { color: green; font-size: 10px; }
        .contact .offline { color: #999; font-size: 10px; }
        
        #chatArea { flex: 1; }
        #chatWith { padding: 10px; background: #f5f5f5; margin-bottom: 10px; font-weight: bold; }
        #messages {
            border: 1px solid #ccc;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message { padding: 8px 12px; margin: 5px 0; border-radius: 5px; max-width: 70%; }
        .message .sender { font-size: 11px; color: #666; }
        .message .text { margin-top: 3px; }
        .message .time { font-size: 10px; color: #999; margin-top: 3px; }
        .sent { background: #dcf8c6; margin-left: auto; }
        .received { background: #f1f1f1; }
        
        #inputArea { display: flex; gap: 10px; }
        #messageInput { flex: 1; padding: 10px; }
        #sendBtn { padding: 10px 20px; }
    </style>
</head>
<body>
    <h2>Simple Messenger</h2>
    
    <div id="loginSection">
        <input type="text" id="usernameInput" placeholder="Enter your username">
        <button id="loginBtn">Join</button>
        <span id="status"></span>
    </div>

    <div id="app">
        <div id="container">
            <div id="contacts">
                <h3>Users</h3>
                <div id="contactList"></div>
            </div>

            <div id="chatArea">
                <div id="chatWith">Select a user to chat</div>
                <div id="messages"></div>
                <div id="inputArea">
                    <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                    <button id="sendBtn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let currentUser = null;
        let selectedContact = null;
        let onlineUsers = [];
        let allUsers = [];

        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const status = document.getElementById('status');
        const app = document.getElementById('app');
        const contactList = document.getElementById('contactList');
        const chatWith = document.getElementById('chatWith');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Login
        loginBtn.addEventListener('click', login);
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

        function login() {
            const username = usernameInput.value.trim();
            if (!username) return;

            currentUser = username;
            connectWebSocket();
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'login', username: currentUser }));
                status.textContent = `Connected as: ${currentUser}`;
                usernameInput.disabled = true;
                loginBtn.disabled = true;
                app.style.display = 'block';
                fetchAllUsers();
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'userList') {
                    onlineUsers = data.users;
                    renderContacts();
                }

                if (data.type === 'history') {
                    renderMessages(data.messages);
                }

                if (data.type === 'message') {
                    const msg = data.message;
                    // Only add if it's part of current conversation
                    if (selectedContact && 
                        ((msg.from_user === currentUser && msg.to_user === selectedContact) ||
                         (msg.from_user === selectedContact && msg.to_user === currentUser))) {
                        appendMessage(msg);
                    }
                }
            };

            ws.onclose = () => {
                status.textContent = 'Disconnected. Refresh to reconnect.';
                status.style.color = 'red';
            };
        }

        async function fetchAllUsers() {
            const res = await fetch('/api/users');
            allUsers = await res.json();
            renderContacts();
        }

        function renderContacts() {
            contactList.innerHTML = '';
            
            // Combine online and all users, excluding self
            const usersToShow = [...new Set([...onlineUsers, ...allUsers])].filter(u => u !== currentUser);
            
            usersToShow.forEach(user => {
                const div = document.createElement('div');
                div.className = 'contact' + (user === selectedContact ? ' active' : '');
                const isOnline = onlineUsers.includes(user);
                div.innerHTML = `${user} <span class="${isOnline ? 'online' : 'offline'}">${isOnline ? '● online' : '○ offline'}</span>`;
                div.onclick = () => selectContact(user);
                contactList.appendChild(div);
            });
        }

        function selectContact(user) {
            selectedContact = user;
            chatWith.textContent = `Chat with: ${user}`;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            renderContacts();
            
            // Request chat history
            ws.send(JSON.stringify({ type: 'getHistory', user1: currentUser, user2: user }));
            messageInput.focus();
        }

        // Send message
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !selectedContact) return;

            ws.send(JSON.stringify({
                type: 'message',
                from: currentUser,
                to: selectedContact,
                text: text
            }));

            messageInput.value = '';
        }

        function renderMessages(messages) {
            messagesDiv.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        }

        function appendMessage(msg) {
            const div = document.createElement('div');
            const isSent = msg.from_user === currentUser;
            div.className = 'message ' + (isSent ? 'sent' : 'received');
            div.innerHTML = `
                <div class="sender">${msg.from_user}</div>
                <div class="text">${escapeHtml(msg.text)}</div>
                <div class="time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
