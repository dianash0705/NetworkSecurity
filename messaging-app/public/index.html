<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeaTime 🍵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lavender: #E6E6FA;
            --lavender-dark: #D8BFD8;
            --mint: #F0FFF0;
            --mint-dark: #98FB98;
            --peach: #FFDAB9;
            --peach-dark: #FFB6A3;
            --pink: #FFE4EC;
            --pink-dark: #FFB6C1;
            --cream: #FFFEF7;
            --text-primary: #5D5A6D;
            --text-secondary: #8E8A9D;
            --shadow-soft: rgba(0, 0, 0, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--lavender) 0%, var(--mint) 50%, var(--peach) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== LOGIN SECTION ===== */
        #loginSection {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 8px 32px var(--shadow-soft);
            animation: floatIn 0.6s ease-out;
        }

        .login-logo {
            font-size: 64px;
            margin-bottom: 8px;
            animation: wiggle 2s ease-in-out infinite;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .login-input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #usernameInput {
            padding: 16px 24px;
            border: 2px solid var(--lavender-dark);
            border-radius: 24px;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            transition: all 0.3s ease;
        }

        #usernameInput:focus {
            border-color: var(--pink-dark);
            box-shadow: 0 0 0 4px rgba(255, 182, 193, 0.2);
            transform: scale(1.02);
        }

        #usernameInput::placeholder {
            color: var(--text-secondary);
        }

        #loginBtn {
            padding: 16px 48px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--pink) 0%, var(--peach) 100%);
            color: var(--text-primary);
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
        }

        #loginBtn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 182, 193, 0.5);
        }

        #loginBtn:active {
            transform: translateY(0) scale(0.98);
        }

        #status {
            display: block;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--mint-dark);
        }

        #status.error {
            color: var(--peach-dark);
        }

        /* ===== MAIN APP ===== */
        #app {
            display: none;
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            max-height: 700px;
            animation: floatIn 0.6s ease-out;
        }

        #container {
            display: flex;
            height: 100%;
            gap: 20px;
        }

        /* ===== SIDEBAR ===== */
        #contacts {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px var(--shadow-soft);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .sidebar-logo {
            font-size: 32px;
            animation: wiggle 3s ease-in-out infinite;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sidebar-user {
            font-size: 12px;
            color: var(--text-secondary);
        }

        #contactList {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        #contactList::-webkit-scrollbar {
            width: 6px;
        }

        #contactList::-webkit-scrollbar-track {
            background: transparent;
        }

        #contactList::-webkit-scrollbar-thumb {
            background: var(--lavender-dark);
            border-radius: 24px;
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        .contact:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateX(4px);
        }

        .contact.active {
            background: linear-gradient(135deg, var(--pink) 0%, var(--lavender) 100%);
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
        }

        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--mint) 0%, var(--lavender) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 2px;
        }

        .contact-status {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.online {
            background: var(--mint-dark);
        }

        .status-dot.offline {
            background: var(--text-secondary);
            animation: none;
        }

        .contact-vibe {
            font-size: 18px;
        }

        /* ===== CHAT AREA ===== */
        #chatArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--cream);
            border-radius: 24px;
            box-shadow: 0 8px 32px var(--shadow-soft);
            overflow: hidden;
        }

        #chatWith {
            padding: 20px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--peach) 0%, var(--pink) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chat-header-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chat-header-info span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(230, 230, 250, 0.1) 100%);
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--lavender-dark);
            border-radius: 24px;
        }

        .message {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 24px;
            animation: messagePopIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
        }

        .message.sent {
            background: linear-gradient(135deg, var(--lavender) 0%, var(--pink) 100%);
            align-self: flex-end;
            border-bottom-right-radius: 8px;
            animation: messagePopIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), floatBubble 4s ease-in-out infinite;
        }

        .message.received {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 8px;
            box-shadow: 0 2px 10px var(--shadow-soft);
            animation: messagePopIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), floatBubble 4s ease-in-out infinite 0.5s;
        }

        .message .sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .message .text {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message .time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: right;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            background: white;
            border-radius: 24px;
            border-bottom-left-radius: 8px;
            align-self: flex-start;
            box-shadow: 0 2px 10px var(--shadow-soft);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--lavender-dark);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: wiggle 2s ease-in-out infinite;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ===== INPUT BAR ===== */
        #inputArea {
            display: flex;
            gap: 12px;
            padding: 20px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
        }

        #messageInput {
            flex: 1;
            padding: 14px 24px;
            border: 2px solid transparent;
            border-radius: 24px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            background: white;
            outline: none;
            transition: all 0.3s ease;
        }

        #messageInput:focus {
            border-color: var(--lavender-dark);
            box-shadow: 0 0 0 4px rgba(216, 191, 216, 0.2);
        }

        #messageInput::placeholder {
            color: var(--text-secondary);
        }

        #messageInput:disabled {
            background: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
        }

        #sendBtn {
            padding: 14px 28px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--mint) 0%, var(--mint-dark) 100%);
            color: var(--text-primary);
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(152, 251, 152, 0.5);
            animation: sendBounce 0.5s ease;
        }

        #sendBtn:active:not(:disabled) {
            transform: translateY(0) scale(0.95);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #sendBtn .btn-icon {
            font-size: 16px;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.9); }
        }

        @keyframes messagePopIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        @keyframes sendBounce {
            0%, 100% { transform: translateY(-2px) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            #app {
                height: 95vh;
                max-height: none;
            }

            #container {
                flex-direction: column;
            }

            #contacts {
                width: 100%;
                height: auto;
                max-height: 200px;
                border-radius: 24px 24px 16px 16px;
            }

            #chatArea {
                border-radius: 16px 16px 24px 24px;
                flex: 1;
            }

            .message {
                max-width: 85%;
            }
        }

        /* ===== NOTIFICATION TOAST ===== */
        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            animation: slideIn 0.3s ease-out;
            cursor: pointer;
            max-width: 320px;
            border-left: 4px solid var(--mint-dark);
        }

        .notification-toast:hover {
            transform: translateX(-4px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .notification-toast.fade-out {
            animation: slideOut 0.3s ease-in forwards;
        }

        .notification-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--peach) 0%, var(--pink) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-sender {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 2px;
        }

        .notification-text {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notification-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .notification-close:hover {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="loginSection">
        <div class="login-logo">🍵</div>
        <h1 class="login-title">TeaTime</h1>
        <p class="login-subtitle">Cozy conversations await ✨</p>
        <div class="login-input-group">
            <input type="text" id="usernameInput" placeholder="What's your name? 🌸">
            <button id="loginBtn">Join the party! 🎉</button>
        </div>
        <span id="status"></span>
    </div>

    <div id="app">
        <div id="container">
            <div id="contacts">
                <div class="sidebar-header">
                    <span class="sidebar-logo">🍵</span>
                    <div>
                        <div class="sidebar-title">TeaTime</div>
                        <div class="sidebar-user" id="currentUserDisplay"></div>
                    </div>
                </div>
                <div id="contactList"></div>
            </div>

            <div id="chatArea">
                <div id="chatWith">
                    <div class="empty-state">
                        <div class="empty-state-icon">💭</div>
                        <h3>No chat selected</h3>
                        <p>Pick a friend to start chatting!</p>
                    </div>
                </div>
                <div id="messages" style="display: none;"></div>
                <div id="inputArea" style="display: none;">
                    <input type="text" id="messageInput" placeholder="Type something sweet... 🌷" disabled>
                    <button id="sendBtn" disabled><span class="btn-icon">✨</span> Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL - FastAPI backend
        const API_BASE = 'http://localhost:8000';
        
        let currentUser = null;
        let selectedContact = null;
        let allUsers = [];
        let pollInterval = null;

        // Vibe emojis for user statuses
        const vibeEmojis = ['🌸', '✨', '🌙', '🍃', '🦋', '🌺', '💫', '🌈', '🍀', '☁️', '🎀', '🧸'];

        const usernameInput = document.getElementById('usernameInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginSection = document.getElementById('loginSection');
        const status = document.getElementById('status');
        const app = document.getElementById('app');
        const contactList = document.getElementById('contactList');
        const chatWith = document.getElementById('chatWith');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const inputArea = document.getElementById('inputArea');
        const currentUserDisplay = document.getElementById('currentUserDisplay');

        // Request browser notification permission
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Login
        loginBtn.addEventListener('click', login);
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

        async function login() {
            const username = usernameInput.value.trim();
            if (!username) return;

            currentUser = username;
            status.textContent = '🔄 Connecting...';
            
            try {
                // Register user with the FastAPI backend
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser,
                        public_key: 'placeholder_key_' + currentUser // Placeholder for now
                    })
                });

                if (response.ok) {
                    status.textContent = `✨ Connected as ${currentUser}`;
                    usernameInput.disabled = true;
                    loginBtn.disabled = true;
                    loginSection.style.display = 'none';
                    app.style.display = 'block';
                    currentUserDisplay.textContent = `Logged in as ${currentUser}`;
                    
                    // Fetch all registered users from backend
                    await fetchAllUsers();
                    
                    // Start polling for new messages
                    startMessagePolling();
                } else {
                    status.textContent = '❌ Failed to connect';
                    status.classList.add('error');
                }
            } catch (error) {
                console.error('Login error:', error);
                status.textContent = '❌ Server not available';
                status.classList.add('error');
            }
        }

        function getRandomVibe() {
            return vibeEmojis[Math.floor(Math.random() * vibeEmojis.length)];
        }

        function getInitials(name) {
            return name.charAt(0).toUpperCase();
        }

        // Fetch all users from backend
        async function fetchAllUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                if (response.ok) {
                    const users = await response.json();
                    allUsers = users.map(u => u.username).filter(u => u !== currentUser);
                }
            } catch (error) {
                console.error('Error fetching users:', error);
            }
            renderContacts();
        }

        function addUserToList(username) {
            if (!allUsers.includes(username) && username !== currentUser) {
                allUsers.push(username);
                renderContacts();
            }
        }

        // Show notification popup
        function showNotification(sender, message) {
            // In-app notification toast
            const toast = document.createElement('div');
            toast.className = 'notification-toast';
            toast.innerHTML = `
                <div class="notification-avatar">${getInitials(sender)}</div>
                <div class="notification-content">
                    <div class="notification-sender">${sender}</div>
                    <div class="notification-text">${escapeHtml(message.substring(0, 50))}${message.length > 50 ? '...' : ''}</div>
                </div>
                <button class="notification-close">✕</button>
            `;
            
            // Click to open conversation
            toast.onclick = (e) => {
                if (!e.target.classList.contains('notification-close')) {
                    addUserToList(sender);
                    selectContact(sender);
                    toast.remove();
                }
            };
            
            toast.querySelector('.notification-close').onclick = (e) => {
                e.stopPropagation();
                toast.remove();
            };
            
            document.body.appendChild(toast);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.classList.add('fade-out');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 5000);
            
            // Browser notification
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(`🍵 New message from ${sender}`, {
                    body: message.substring(0, 100),
                    icon: '🍵'
                });
            }
        }

        function renderContacts() {
            contactList.innerHTML = '';
            
            if (allUsers.length === 0) {
                contactList.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--text-secondary);">
                        <div style="font-size: 32px; margin-bottom: 8px;">🌙</div>
                        <p>No friends yet...</p>
                        <input type="text" id="newContactInput" placeholder="Add username" 
                            style="margin-top: 12px; padding: 8px 12px; border: 2px solid var(--lavender-dark); 
                            border-radius: 12px; font-family: inherit; font-size: 12px; width: 100%;">
                        <button id="addContactBtn" 
                            style="margin-top: 8px; padding: 8px 16px; border: none; border-radius: 12px; 
                            background: var(--mint); cursor: pointer; font-family: inherit; font-weight: 600;">
                            Add Friend 🌸
                        </button>
                    </div>
                `;
                
                setTimeout(() => {
                    const addBtn = document.getElementById('addContactBtn');
                    const input = document.getElementById('newContactInput');
                    if (addBtn && input) {
                        addBtn.onclick = () => {
                            const name = input.value.trim();
                            if (name) addUserToList(name);
                        };
                        input.onkeypress = (e) => {
                            if (e.key === 'Enter') {
                                const name = input.value.trim();
                                if (name) addUserToList(name);
                            }
                        };
                    }
                }, 0);
                return;
            }

            // Add contact input at top
            const addSection = document.createElement('div');
            addSection.style.cssText = 'margin-bottom: 16px; display: flex; gap: 8px;';
            addSection.innerHTML = `
                <input type="text" id="newContactInput" placeholder="Add friend..." 
                    style="flex: 1; padding: 8px 12px; border: 2px solid var(--lavender-dark); 
                    border-radius: 12px; font-family: inherit; font-size: 12px;">
                <button id="addContactBtn" 
                    style="padding: 8px 12px; border: none; border-radius: 12px; 
                    background: var(--mint); cursor: pointer; font-size: 14px;">➕</button>
            `;
            contactList.appendChild(addSection);

            setTimeout(() => {
                const addBtn = document.getElementById('addContactBtn');
                const input = document.getElementById('newContactInput');
                if (addBtn && input) {
                    addBtn.onclick = () => {
                        const name = input.value.trim();
                        if (name) {
                            addUserToList(name);
                            input.value = '';
                        }
                    };
                    input.onkeypress = (e) => {
                        if (e.key === 'Enter') {
                            const name = input.value.trim();
                            if (name) {
                                addUserToList(name);
                                input.value = '';
                            }
                        }
                    };
                }
            }, 0);

            allUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'contact' + (user === selectedContact ? ' active' : '');
                const vibe = getRandomVibe();
                
                div.innerHTML = `
                    <div class="contact-avatar">${getInitials(user)}</div>
                    <div class="contact-info">
                        <div class="contact-name">${user}</div>
                        <div class="contact-status">
                            <span class="status-dot online"></span>
                            <span style="color: var(--text-secondary);">Available</span>
                        </div>
                    </div>
                    <span class="contact-vibe">${vibe}</span>
                `;
                div.onclick = () => selectContact(user);
                contactList.appendChild(div);
            });
        }

        async function selectContact(user) {
            selectedContact = user;
            
            chatWith.innerHTML = `
                <div class="chat-header-avatar">${getInitials(user)}</div>
                <div class="chat-header-info">
                    <h3>${user}</h3>
                    <span>🟢 Available</span>
                </div>
            `;
            
            messagesDiv.style.display = 'flex';
            inputArea.style.display = 'flex';
            messageInput.disabled = false;
            sendBtn.disabled = false;
            renderContacts();
            
            // Load conversation history from backend
            await loadConversationFromBackend(user);
            messageInput.focus();
        }

        // Load conversation from backend
        async function loadConversationFromBackend(contact) {
            try {
                const response = await fetch(`${API_BASE}/conversation/${currentUser}/${contact}`);
                if (response.ok) {
                    const messages = await response.json();
                    renderMessages(messages);
                } else {
                    renderMessages([]);
                }
            } catch (error) {
                console.error('Error loading conversation:', error);
                renderMessages([]);
            }
        }

        // Send message with key exchange
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !selectedContact) return;

            try {
                // Step 1: Get receiver's public key (key exchange)
                const keyResponse = await fetch(`${API_BASE}/get-public-key/${selectedContact}`);
                
                if (!keyResponse.ok) {
                    const error = await keyResponse.json();
                    if (error.detail === 'User not found') {
                        alert(`User "${selectedContact}" is not registered yet. They need to join TeaTime first! 🍵`);
                        return;
                    }
                    throw new Error(error.detail);
                }
                
                const keyData = await keyResponse.json();
                console.log(`Key exchange: Got public key for ${selectedContact}:`, keyData.public_key);
                
                // Step 2: Encrypt message with receiver's public key (placeholder - using plaintext for now)
                // In a real E2E implementation, you would encrypt here using the public key
                const encryptedContent = content; // TODO: Implement actual encryption
                
                // Step 3: Send the message
                const messageData = {
                    sender: currentUser,
                    receiver: selectedContact,
                    encrypted_content: encryptedContent
                };

                const response = await fetch(`${API_BASE}/send-message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(messageData)
                });

                if (response.ok) {
                    // Add message to display immediately
                    const localMsg = {
                        sender: currentUser,
                        receiver: selectedContact,
                        encrypted_content: content,
                        timestamp: new Date().toISOString()
                    };
                    
                    appendMessage(localMsg);
                    messageInput.value = '';
                    
                    // Make sure receiver is in contacts
                    addUserToList(selectedContact);
                } else {
                    const error = await response.json();
                    console.error('Send error:', error);
                    alert('Failed to send message: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Send error:', error);
                alert('Failed to send message. Is the server running?');
            }
        }

        // Poll for new messages
        function startMessagePolling() {
            // Poll every 2 seconds
            pollInterval = setInterval(fetchNewMessages, 2000);
            fetchNewMessages(); // Fetch immediately
        }

        async function fetchNewMessages() {
            if (!currentUser) return;

            try {
                const response = await fetch(`${API_BASE}/fetch-messages/${currentUser}`);
                if (response.ok) {
                    const messages = await response.json();
                    
                    if (messages.length > 0) {
                        console.log(`🔔 Fetched ${messages.length} new messages for ${currentUser}:`, messages);
                        
                        for (const msg of messages) {
                            console.log(`📩 New message from ${msg.sender}: ${msg.encrypted_content}`);
                            
                            // Add sender to contacts automatically (even if not a friend yet)
                            addUserToList(msg.sender);
                            
                            // Always show notification for new messages
                            showNotification(msg.sender, msg.encrypted_content);
                            
                            // If viewing this conversation, also append to chat
                            if (selectedContact === msg.sender) {
                                appendMessage({
                                    sender: msg.sender,
                                    receiver: msg.receiver,
                                    encrypted_content: msg.encrypted_content,
                                    timestamp: msg.timestamp
                                });
                            }
                        }
                        
                        // Refresh user list if new messages arrived
                        await fetchAllUsers();
                    }
                } else {
                    console.error('Fetch messages failed:', response.status);
                }
            } catch (error) {
                console.error('Polling error:', error);
            }
        }

        function renderMessages(messages) {
            messagesDiv.innerHTML = '';
            
            if (messages.length === 0) {
                messagesDiv.innerHTML = `
                    <div class="empty-state" style="flex: 1;">
                        <div class="empty-state-icon">🌸</div>
                        <h3>Start the conversation!</h3>
                        <p>Say something nice...</p>
                    </div>
                `;
                return;
            }
            
            messages.forEach(msg => appendMessage(msg, false));
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function appendMessage(msg, scroll = true) {
            // Remove empty state if present
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const div = document.createElement('div');
            const isSent = msg.sender === currentUser;
            div.className = 'message ' + (isSent ? 'sent' : 'received');
            
            const time = new Date(msg.timestamp);
            const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            div.innerHTML = `
                <div class="sender">${isSent ? 'You' : msg.sender}</div>
                <div class="text">${escapeHtml(msg.encrypted_content)}</div>
                <div class="time">${timeStr}</div>
            `;
            messagesDiv.appendChild(div);
            
            if (scroll) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pollInterval) clearInterval(pollInterval);
        });
    </script>
</body>
</html>
